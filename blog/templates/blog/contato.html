{% extends 'blog/base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h2 class="text-center mb-3">
                         Fale Conosco
                    </h2>

                    <p class="text-center text-muted mb-4">
                        Envie uma mensagem, crítica ou sugestão.
                        Teremos prazer em responder.
                    </p>


                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            {{ form.nome.label }}
                            {{ form.nome }}
                        </div>

                        <div class="mb-3">
                            {{ form.email.label }}
                            {{ form.email }}
                        </div>

                        <div class="mb-3">
                            {{ form.mensagem.label }}
                            {{ form.mensagem }}
                        </div>

                        <div class="text-center">
                            <button 
                                type="submit"
                                class="btn btn-primary btn-lg px-5">
                                Enviar mensagem
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
